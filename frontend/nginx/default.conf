# Porta de entrada da aplicação (ADR-0003 e ADR-0004):
#   /      -> build estático do SvelteKit
#   /api/  -> FastAPI (serviço "app" do compose), sem o prefixo /api
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Limite de upload das fotos (RF04)
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O nginx é a borda: sobrescreve (e não acrescenta) o X-Forwarded-For,
        # para o cliente não conseguir forjar o próprio IP no rate limiting
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome nunca mudam: cache de um ano
    location /_app/immutable/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # HTML sempre revalidado, para um deploy novo aparecer na hora
        add_header Cache-Control "no-cache" always;
        # Páginas pré-renderizadas (/cadastro -> cadastro.html) e fallback SPA
        try_files $uri $uri.html $uri/ /200.html;
    }
}

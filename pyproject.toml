[project]
name = "dressme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "anyio>=4.12.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "dynaconf>=3.2.12",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.129.0",
    "pendulum>=3.2.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn>=0.41.0",
]

[dependency-groups]
test = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["integration: requer Postgres (TEST_DATABASE_URL)"]

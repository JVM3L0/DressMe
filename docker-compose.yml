services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # Acessível apenas pela própria máquina
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    container_name: fastapi_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      # A API não é publicada no host: só o nginx (rede do compose) a alcança,
      # então é seguro confiar no X-Forwarded-For que ele define
      FORWARDED_ALLOW_IPS: "*"
      # O nginx publica a API em /api: o /docs precisa saber o prefixo
      UVICORN_ROOT_PATH: /api
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck/', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: ./frontend
    container_name: virtualfit_web
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Entrada única da aplicação: frontend em / e API em /api/. Só nesta
      # máquina por padrão; WEB_HOST=0.0.0.0 abre para a rede local (celular)
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  postgres_data:

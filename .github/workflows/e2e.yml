name: E2E

# Sobe o ambiente completo (nginx, API e banco) e roda o fluxo principal num
# navegador real. Pega o que os testes de unidade e de componente não veem:
# a CSP, o nginx, os cookies e as imagens servidas de verdade (DT-13).

on:
  pull_request:
    branches: [develop, staging, main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [develop, staging, main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Fluxo principal no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cria o .env (credenciais descartáveis, só para este job)
        run: |
          {
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=ci"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Sobe o ambiente completo
        run: docker compose up -d --build --wait

      - name: Instala o navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Roda o fluxo principal
        working-directory: frontend
        run: npm run e2e

      - name: Logs dos serviços (se falhar)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Captura de tela (se falhar)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-falha
          path: frontend/e2e/artifacts/
          if-no-files-found: ignore
